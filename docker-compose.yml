services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app/data
    restart: always

  create-super-admin:
    image: security-backend
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app/data
    command: python scripts/create_super_admin.py
    profiles:
      - admin

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://security.paramountech.pk/api
    expose:
      - "3000"
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3001:3000"
      - "8001:8000"
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  backend_data:
